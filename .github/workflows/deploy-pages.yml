name: Deploy terrain data to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'Server/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows:
      - 'Generate Fuji seed tile'
      - 'Generate Fuji terrain dataset'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Server
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
