name: Generate full Kanto GIS water

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/kanto-water-full-request'

permissions:
  contents: write

concurrency:
  group: map-source-kanto-water-full
  cancel-in-progress: false

env:
  SHARD_COUNT: '6'
  ROOT_WATER: Server/data/regions/kanto/water

jobs:
  generate:
    name: water-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/requirements-water.txt

      - name: Install water dependencies
        run: pip install -r Tools/requirements-water.txt

      - name: Configure isolated shard branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="kanto-water-${GITHUB_RUN_ID}-s${{ matrix.shard }}"
          git checkout -b "$branch"
          echo "SHARD_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "GSW1_SHARD_READY shard=${{ matrix.shard }}/${SHARD_COUNT} branch=$branch"

      - name: Generate and checkpoint shard
        shell: bash
        run: |
          set -Eeuo pipefail
          batches=0
          total=0
          for batch in $(seq 1 20); do
            echo "=== water shard ${{ matrix.shard }} batch $batch ==="
            python Tools/build_water_region.py \
              --shard-count "$SHARD_COUNT" \
              --shard-index '${{ matrix.shard }}' \
              --max-tiles 50 \
              --attempts 3

            git add "$ROOT_WATER"
            if git diff --cached --quiet; then
              echo "GSW1_SHARD_NO_MORE shard=${{ matrix.shard }}"
              break
            fi
            tiles=$(git diff --cached --name-only -- "$ROOT_WATER" | sed -E 's#^.*/([0-9]{2}_[0-9]{2})\.gsw1$#\1#' | sort -u | wc -l)
            git commit -m "data: expand Kanto water shard ${{ matrix.shard }} (+${tiles} tiles)"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push -u origin "HEAD:$SHARD_BRANCH"; then pushed=1; break; fi
              sleep $((attempt * 4))
            done
            (( pushed == 1 )) || { echo 'water shard push failed'; exit 1; }
            batches=$((batches + 1))
            total=$((total + tiles))
            echo "GSW1_SHARD_CHECKPOINT shard=${{ matrix.shard }} batches=$batches totalTiles=$total"
          done
          echo "GSW1_SHARD_DONE shard=${{ matrix.shard }} batches=$batches committedTiles=$total"

  merge:
    name: merge-water-shards
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Merge available shard branches
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          merged=0
          for shard in 0 1 2 3 4 5; do
            branch="kanto-water-${GITHUB_RUN_ID}-s${shard}"
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "GSW1_SHARD_MISSING shard=$shard"
              continue
            fi
            git fetch --depth=1 origin "$branch:refs/remotes/origin/$branch"
            if git diff --quiet HEAD "origin/$branch" -- "$ROOT_WATER"; then
              echo "GSW1_SHARD_EMPTY shard=$shard"
              continue
            fi
            git merge --squash "origin/$branch"
            tiles=$(git diff --cached --name-only -- "$ROOT_WATER" | sed -E 's#^.*/([0-9]{2}_[0-9]{2})\.gsw1$#\1#' | sort -u | wc -l)
            git commit -m "data: merge Kanto water shard ${shard} (+${tiles} tiles)"
            merged=$((merged + tiles))
            echo "GSW1_SHARD_MERGED shard=$shard tiles=$tiles mergedTotal=$merged"
          done

          if (( merged > 0 )); then
            git fetch origin main
            git merge --no-edit origin/main
            git push origin HEAD:main
          fi

          for shard in 0 1 2 3 4 5; do
            git push origin --delete "kanto-water-${GITHUB_RUN_ID}-s${shard}" 2>/dev/null || true
          done
          echo "GSW1_MERGE_DONE mergedTiles=$merged"

      - name: Summarize coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          import struct
          roots = [Path('Server/data/regions/kanto/water/pc'), Path('Server/data/regions/kanto/water/quest')]
          complete = 0
          invalid = []
          for y in range(63):
              for x in range(60):
                  stem = f'{x:02d}_{y:02d}.gsw1'
                  ok = True
                  for root in roots:
                      p = root / stem
                      if not p.is_file():
                          ok = False; break
                      b = p.read_bytes()
                      if len(b) < 16 or b[:4] != b'GSW1' or b[4] != 1:
                          ok = False; break
                      vc = struct.unpack_from('<H', b, 6)[0]
                      ic = struct.unpack_from('<I', b, 8)[0]
                      if len(b) != 16 + vc * 6 + ic * 2 or ic % 3:
                          ok = False; break
                  if ok: complete += 1
                  else: invalid.append(stem)
          print(f'GSW1_COVERAGE complete={complete}/3780 remaining={3780-complete} invalid={len(invalid)}')
          if invalid: print('missing_or_invalid:', ' '.join(invalid[:50]))
          PY
