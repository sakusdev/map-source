name: Generate Kanto LOD3 DEM

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/kanto-lod3-request'

permissions:
  contents: write

concurrency:
  group: map-source-kanto-lod3
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dataset dependencies
        run: python -m pip install -r Tools/requirements.txt

      - name: Generate 1024 km MeshLOD3 DEM
        env:
          GSI_REQUEST_DELAY: '0.04'
          GSI_HTTP_TIMEOUT: '25'
          GSI_HTTP_ATTEMPTS: '6'
        run: |
          set -Eeuo pipefail
          python Tools/build_kanto_lod3_dem.py | tee /tmp/kanto-lod3.log
          grep -Fq '[GST2-LOD3] DATA_READY coverage=1024kmx1024km radiusBaseChunks=128 grid=129x129 spacingMeters=8000 sourceZ=8' /tmp/kanto-lod3.log

      - name: Validate and publish
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('Server/data/regions/kanto-lod3/dem/00_00.gst2')
          b = p.read_bytes()
          assert len(b) == 16 + 129 * 129 * 2, len(b)
          assert b[:4] == b'GST2' and b[4] == 2
          assert int.from_bytes(b[6:8], 'little') == 129
          print('[GST2-LOD3] VALID coverage=1024kmx1024km radiusBaseChunks=128 bytes=' + str(len(b)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Server/data/regions/kanto-lod3
          if git diff --cached --quiet; then
            echo '[GST2-LOD3] PUBLISH_NO_CHANGES'
          else
            git commit -m 'data: publish Kanto MeshLOD3 DEM'
            git push origin HEAD:main
            echo '[GST2-LOD3] PUBLISH_SUCCESS'
          fi
