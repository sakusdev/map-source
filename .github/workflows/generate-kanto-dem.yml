name: Generate Kanto DEM region

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Generation mode'
        required: true
        default: 'row'
        type: choice
        options: [seed, row, all]
      tile_x:
        description: 'Tile X for seed mode (0..59)'
        required: false
        default: '30'
      tile_y:
        description: 'Tile Y for seed mode (0..62)'
        required: false
        default: '31'
      row_y:
        description: 'Row Y for row mode (0..62)'
        required: false
        default: '31'
      overwrite:
        description: 'Regenerate files that already exist'
        required: true
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths:
      - '.github/kanto-dem-request'

concurrency:
  group: map-source-kanto-dem
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      tile_x: ${{ steps.request.outputs.tile_x }}
      tile_y: ${{ steps.request.outputs.tile_y }}
      row_y: ${{ steps.request.outputs.row_y }}
      overwrite: ${{ steps.request.outputs.overwrite }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve request
        id: request
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode || 'all' }}
          DISPATCH_TILE_X: ${{ inputs.tile_x || '30' }}
          DISPATCH_TILE_Y: ${{ inputs.tile_y || '31' }}
          DISPATCH_ROW_Y: ${{ inputs.row_y || '31' }}
          DISPATCH_OVERWRITE: ${{ inputs.overwrite || 'false' }}
        run: |
          set -Eeuo pipefail
          mode="$DISPATCH_MODE"; tile_x="$DISPATCH_TILE_X"; tile_y="$DISPATCH_TILE_Y"; row_y="$DISPATCH_ROW_Y"; overwrite="$DISPATCH_OVERWRITE"
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            req='.github/kanto-dem-request'
            read_req() { awk -F= -v key="$1" '$1==key {print $2}' "$req" | tail -n1; }
            mode=$(read_req mode); tile_x=$(read_req tile_x); tile_y=$(read_req tile_y); row_y=$(read_req row_y); overwrite=$(read_req overwrite)
            mode=${mode:-all}; tile_x=${tile_x:-30}; tile_y=${tile_y:-31}; row_y=${row_y:-31}; overwrite=${overwrite:-false}
          fi
          case "$mode" in seed|row|all) ;; *) echo "invalid mode: $mode"; exit 2 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tile_x=$tile_x" >> "$GITHUB_OUTPUT"
          echo "tile_y=$tile_y" >> "$GITHUB_OUTPUT"
          echo "row_y=$row_y" >> "$GITHUB_OUTPUT"
          echo "overwrite=$overwrite" >> "$GITHUB_OUTPUT"
          echo "Kanto request mode=$mode tile=$tile_x,$tile_y row=$row_y overwrite=$overwrite"

  small:
    if: needs.plan.outputs.mode != 'all'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GSI_REQUEST_DELAY: '0.08'
      GSI_HTTP_TIMEOUT: '20'
      GSI_HTTP_ATTEMPTS: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/requirements.txt
      - run: pip install -r Tools/requirements.txt
      - name: Generate seed or row
        shell: bash
        run: |
          set -Eeuo pipefail
          extra=()
          if [[ '${{ needs.plan.outputs.overwrite }}' == 'true' ]]; then extra+=(--overwrite); fi
          mode='${{ needs.plan.outputs.mode }}'
          if [[ "$mode" == seed ]]; then
            x='${{ needs.plan.outputs.tile_x }}'; y='${{ needs.plan.outputs.tile_y }}'
            python Tools/build_dem_region.py --region kanto --tile "$x" "$y" "${extra[@]}"
          else
            y='${{ needs.plan.outputs.row_y }}'
            python Tools/build_dem_region.py --region kanto --row "$y" "${extra[@]}"
          fi
      - name: Validate and publish checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import pathlib, struct
          root = pathlib.Path('Server/data/regions/kanto/dem')
          files = sorted(root.glob('*.gst2'))
          assert files, 'no GST2 outputs'
          for p in files:
              b = p.read_bytes(); grid = struct.unpack_from('<H', b, 6)[0]
              assert b[:4] == b'GST2' and b[4] == 2 and grid == 129 and len(b) == 16 + grid*grid*2, p
          print('GST2 validated', len(files))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Server/data/regions/kanto
          if ! git diff --cached --quiet; then
            git commit -m 'data: add Kanto DEM checkpoint'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  full-generate:
    if: needs.plan.outputs.mode == 'all'
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GSI_REQUEST_DELAY: '0.08'
      GSI_HTTP_TIMEOUT: '20'
      GSI_HTTP_ATTEMPTS: '6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/requirements.txt
      - run: pip install -r Tools/requirements.txt
      - name: Generate contiguous Kanto shard
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf Server/data/regions/kanto/dem
          start=$(( ${{ matrix.shard }} * 7 ))
          end=$(( start + 6 ))
          if (( end > 62 )); then end=62; fi
          echo "shard=${{ matrix.shard }} rows=$start..$end"
          extra=()
          if [[ '${{ needs.plan.outputs.overwrite }}' == 'true' ]]; then extra+=(--overwrite); fi
          python Tools/build_dem_region.py --region kanto --rows "$start" "$end" "${extra[@]}"
          expected=$(( (end - start + 1) * 60 ))
          count=$(find Server/data/regions/kanto/dem -maxdepth 1 -name '*.gst2' | wc -l)
          echo "shard tiles=$count expected=$expected"
          test "$count" -eq "$expected"
          python - <<'PY'
          import pathlib, struct
          files = sorted(pathlib.Path('Server/data/regions/kanto/dem').glob('*.gst2'))
          for p in files:
              b=p.read_bytes(); g=struct.unpack_from('<H', b, 6)[0]
              assert b[:4]==b'GST2' and b[4]==2 and g==129 and len(b)==16+g*g*2, p
          print('validated shard files', len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kanto-dem-shard-${{ matrix.shard }}
          path: Server/data/regions/kanto/dem/*.gst2
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

  full-publish:
    if: needs.plan.outputs.mode == 'all'
    needs: [plan, full-generate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r Tools/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: kanto-dem-shard-*
          path: _kanto_generated
          merge-multiple: true
      - name: Assemble and verify complete region
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p Server/data/regions/kanto/dem
          cp _kanto_generated/*.gst2 Server/data/regions/kanto/dem/
          python Tools/build_dem_region.py --region kanto --tile 30 31
          count=$(find Server/data/regions/kanto/dem -maxdepth 1 -name '*.gst2' | wc -l)
          echo "Kanto GST2 tiles=$count expected=3780"
          test "$count" -eq 3780
          python - <<'PY'
          import json, pathlib, struct
          manifest = json.loads(pathlib.Path('Server/data/regions/kanto/manifest.json').read_text())
          assert manifest['grid'] == {'x': 60, 'y': 63}
          assert manifest['dem']['grid'] == 129
          files = sorted(pathlib.Path('Server/data/regions/kanto/dem').glob('*.gst2'))
          assert len(files) == 3780
          for p in files:
              b=p.read_bytes(); g=struct.unpack_from('<H', b, 6)[0]
              assert b[:4]==b'GST2' and b[4]==2 and g==129 and len(b)==16+g*g*2, p
          print('complete Kanto DEM validation OK:', len(files))
          print('coverage:', manifest['coverage'])
          PY
          du -sh Server/data/regions/kanto
      - name: Commit complete Kanto region
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Server/data/regions/kanto
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish complete Kanto GST2 DEM region'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
