name: Generate Fuji seed tile

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Tools/build_dataset.py'
      - 'Tools/build_seed_tile.py'
      - 'Tools/requirements.txt'
      - '.github/workflows/generate-seed.yml'

permissions:
  contents: write

concurrency:
  group: map-source-seed
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/requirements.txt

      - name: Install generator dependencies
        run: pip install -r Tools/requirements.txt

      - name: Generate Fuji seed tile
        env:
          GSI_REQUEST_DELAY: '0.05'
        run: python Tools/build_seed_tile.py

      - name: Verify generated payloads
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s Server/data/pc/07_06.jpg
          test -s Server/data/quest/07_06.jpg
          test -s Server/data/dem/07_06.gst2
          file Server/data/pc/07_06.jpg Server/data/quest/07_06.jpg Server/data/dem/07_06.gst2
          ls -lh Server/data/pc/07_06.jpg Server/data/quest/07_06.jpg Server/data/dem/07_06.gst2

      - name: Commit generated seed data
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Server/data/pc/07_06.jpg Server/data/quest/07_06.jpg Server/data/dem/07_06.gst2
          if git diff --cached --quiet; then
            echo 'Seed data unchanged.'
            exit 0
          fi
          git commit -m 'data: generate Fuji seed tile 07_06 (v2)'
          git pull --rebase origin main
          git push origin HEAD:main
