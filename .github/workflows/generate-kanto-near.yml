name: Generate Kanto near-detail region

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Generation budget in minutes per shard'
        required: true
        default: '285'
      batch_tiles:
        description: 'Completed 4km tiles per checkpoint'
        required: true
        default: '4'
  push:
    branches: [ main ]
    paths:
      - '.github/kanto-near-request'

permissions:
  contents: write

concurrency:
  group: map-source-kanto-near
  cancel-in-progress: false

env:
  GSI_REQUEST_DELAY: '0.08'
  GSI_HTTP_TIMEOUT: '25'
  GSI_HTTP_ATTEMPTS: '6'
  ROOT_NEAR: Server/data/regions/kanto/near-z18-s4
  SHARD_COUNT: '6'

jobs:
  generate:
    name: generate-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 315
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/requirements.txt

      - name: Install dependencies
        run: pip install -r Tools/requirements.txt

      - name: Configure isolated shard branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="kanto-near-${GITHUB_RUN_ID}-s${{ matrix.shard }}"
          git checkout -B "$branch" origin/main
          echo "SHARD_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "KANTO_NEAR_SHARD_READY shard=${{ matrix.shard }}/${SHARD_COUNT} branch=$branch"

      - name: Generate shard and checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            run_minutes='${{ inputs.run_minutes }}'
            batch_tiles='${{ inputs.batch_tiles }}'
          else
            run_minutes=285
            batch_tiles=4
          fi
          [[ "$run_minutes" =~ ^[0-9]+$ ]] || { echo "invalid run_minutes=$run_minutes"; exit 2; }
          [[ "$batch_tiles" =~ ^[1-9][0-9]*$ ]] || { echo "invalid batch_tiles=$batch_tiles"; exit 2; }

          deadline=$(( $(date +%s) + run_minutes * 60 ))
          batches=0
          total_committed=0
          fail_streak=0
          mkdir -p "$ROOT_NEAR"

          while (( $(date +%s) < deadline )); do
            echo "=== Kanto near shard ${{ matrix.shard }} batch $((batches + 1)) ==="
            if ! python Tools/build_near_region.py \
              --region kanto \
              --source-zoom 18 \
              --subdivision 4 \
              --shard-count "$SHARD_COUNT" \
              --shard-index '${{ matrix.shard }}' \
              --max-tiles "$batch_tiles" \
              --max-seconds 1500 \
              --tile-attempts 2; then
              fail_streak=$((fail_streak + 1))
              echo "near shard batch failed streak=$fail_streak"
              git clean -fd -- "$ROOT_NEAR" || true
              git checkout -- "$ROOT_NEAR" 2>/dev/null || true
              if (( fail_streak >= 4 )); then
                echo "::warning::Shard ${{ matrix.shard }} stopped after four consecutive failed batches"
                break
              fi
              sleep 30
              continue
            fi
            fail_streak=0

            git add "$ROOT_NEAR"
            if git diff --cached --quiet; then
              echo 'no new complete near-detail tiles for this shard'
              break
            fi

            tiles=$(git diff --cached --name-only -- "$ROOT_NEAR" | grep -E '\.json$' | wc -l)
            files=$(git diff --cached --name-only -- "$ROOT_NEAR" | wc -l)
            echo "checkpoint shard=${{ matrix.shard }} tiles=$tiles files=$files"
            git commit -m "data: expand kanto Z18 near shard ${{ matrix.shard }} (+${tiles} tiles)"

            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push -u origin "HEAD:$SHARD_BRANCH"; then
                pushed=1
                break
              fi
              echo "push retry $attempt/5"
              sleep $((attempt * 5))
            done
            if (( pushed == 0 )); then
              echo 'could not checkpoint generated shard imagery'
              exit 1
            fi

            batches=$((batches + 1))
            total_committed=$((total_committed + tiles))
            echo "KANTO_NEAR_SHARD_CHECKPOINT shard=${{ matrix.shard }} batches=$batches totalTiles=$total_committed"
            sleep 2
          done

          echo "KANTO_NEAR_SHARD_DONE shard=${{ matrix.shard }} batches=$batches committedTiles=$total_committed"

  merge:
    name: merge-shards-to-main
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge completed shard branches
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main

          merged=0
          for shard in 0 1 2 3 4 5; do
            branch="kanto-near-${GITHUB_RUN_ID}-s${shard}"
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "KANTO_NEAR_SHARD_MISSING shard=$shard branch=$branch"
              continue
            fi
            git fetch origin "$branch:refs/remotes/origin/$branch"
            if git diff --quiet HEAD "origin/$branch" -- "$ROOT_NEAR"; then
              echo "KANTO_NEAR_SHARD_EMPTY shard=$shard"
              continue
            fi
            git merge --squash "origin/$branch"
            files=$(git diff --cached --name-only -- "$ROOT_NEAR" | wc -l)
            tiles=$(git diff --cached --name-only -- "$ROOT_NEAR" | grep -E '\.json$' | wc -l)
            git commit -m "data: merge kanto Z18 shard ${shard} (+${tiles} tiles)"
            merged=$((merged + tiles))
            echo "KANTO_NEAR_SHARD_MERGED shard=$shard tiles=$tiles files=$files mergedTotal=$merged"
          done

          if (( merged == 0 )); then
            echo 'KANTO_NEAR_MERGE_NO_CHANGES'
          else
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git merge --no-edit origin/main; then
                echo 'main changed with conflicts while merging shards'
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "main push retry $attempt/5"
              sleep $((attempt * 5))
            done
            (( pushed == 1 )) || { echo 'could not publish merged shards'; exit 1; }
          fi

          for shard in 0 1 2 3 4 5; do
            branch="kanto-near-${GITHUB_RUN_ID}-s${shard}"
            git push origin --delete "$branch" 2>/dev/null || true
          done
          echo "KANTO_NEAR_MERGE_DONE mergedTiles=$merged"

      - name: Summarize coverage
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          root = Path('Server/data/regions/kanto/near-z18-s4')
          complete = 0
          incomplete = []
          for y in range(63):
              for x in range(60):
                  stem = f'{x:02d}_{y:02d}'
                  meta = root / f'{stem}.json'
                  cells = [root / f'{stem}_c{i:02d}.jpg' for i in range(16)]
                  if meta.is_file() and meta.stat().st_size > 0 and all(p.is_file() and p.stat().st_size > 0 for p in cells):
                      complete += 1
                  elif meta.exists() or any(p.exists() for p in cells):
                      incomplete.append(stem)
          print(f'KANTO_NEAR_COVERAGE complete={complete}/3780 remaining={3780-complete} incomplete={len(incomplete)}')
          if incomplete:
              print('incomplete:', ' '.join(incomplete[:50]))
          PY
