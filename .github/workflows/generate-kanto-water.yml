name: Generate Kanto GIS water

on:
  workflow_dispatch:
    inputs:
      tile_x:
        description: 'Kanto tile X'
        required: true
        default: '46'
      tile_y:
        description: 'Kanto tile Y'
        required: true
        default: '30'
      overwrite:
        description: 'Regenerate existing tile'
        required: true
        default: true
        type: boolean
  push:
    branches: [ main ]
    paths:
      - '.github/kanto-water-request'

permissions:
  contents: write

concurrency:
  group: map-source-kanto-water
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/requirements-water.txt

      - name: Install water generator dependencies
        run: pip install -r Tools/requirements-water.txt

      - name: Configure git
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Generate Overture water mesh tile
        shell: bash
        env:
          TILE_X: ${{ github.event_name == 'workflow_dispatch' && inputs.tile_x || '46' }}
          TILE_Y: ${{ github.event_name == 'workflow_dispatch' && inputs.tile_y || '30' }}
          OVERWRITE: ${{ github.event_name == 'push' && 'true' || inputs.overwrite }}
        run: |
          set -Eeuo pipefail
          extra=()
          if [[ "$OVERWRITE" == 'true' ]]; then extra+=(--overwrite); fi
          python Tools/build_water.py --tile "$TILE_X" "$TILE_Y" "${extra[@]}"

      - name: Verify GSW1 output
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import pathlib, struct
          files = sorted(pathlib.Path('Server/data/regions/kanto/water').glob('*/*.gsw1'))
          if not files:
              raise SystemExit('no GSW1 water outputs')
          for p in files:
              b = p.read_bytes()
              if len(b) < 16 or b[:4] != b'GSW1' or b[4] != 1:
                  raise SystemExit(f'invalid GSW1 header: {p}')
              vc = struct.unpack_from('<H', b, 6)[0]
              ic = struct.unpack_from('<I', b, 8)[0]
              expected = 16 + vc * 6 + ic * 2
              if len(b) != expected or ic % 3:
                  raise SystemExit(f'invalid GSW1 size: {p} vc={vc} ic={ic} bytes={len(b)} expected={expected}')
              print(f'GSW1_OK path={p} vertices={vc} triangles={ic//3} bytes={len(b)}')
          PY

      - name: Commit generated water data
        shell: bash
        run: |
          set -Eeuo pipefail
          git add Server/data/regions/kanto/water
          if git diff --cached --quiet; then
            echo 'water data unchanged'
            exit 0
          fi
          git commit -m 'data: generate Kanto GIS water seed'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'GSW1_PUBLISH_SUCCESS'

      - name: Size summary
        shell: bash
        run: |
          du -sh Server/data/regions/kanto/water || true
          find Server/data/regions/kanto/water -type f -name '*.gsw1' | wc -l
